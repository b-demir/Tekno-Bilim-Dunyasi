<!DOCTYPE html>
<!-- data-bs-theme: açık ve koyu modu ayarlar -->
<html lang="tr" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <script>
        // Bu kod o anki sayfamız için linklerin ana dizinde aranmasını sağlar.
        const PROJE_KLASORU = "Tekno-Bilim-Dunyasi"; // Proje Klasörü

        const tam_yol = window.location.href; // Dosyanın tam yolu

        // Proje klasörünün başladığı kısım yolun içinde değilse -1 alır
        const klasor_baslangici = tam_yol.indexOf(PROJE_KLASORU);

        // Proje klasörünün başladığı kısım yolun içindeyse dizini bizim ana dizinimize ayarlar
        if (klasor_baslangici !== -1) {
            const ana_dizin = tam_yol.substring(0, klasor_baslangici + PROJE_KLASORU.length) + "/";
            document.write('<base href="' + ana_dizin + '">');
        }
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS'i -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">

    <!-- İkonlar için Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Kendi harici CSS dosyamız -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Bootstrap JS'i -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous" defer></script>

    <!-- Kendi harici JS dosyamız -->
    <script src="js/main.js" defer></script>

    <title>Tekno Bilim Dünyası</title>
</head>

<body>

</body>

</html>
